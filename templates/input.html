<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }
        </script><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>
        * {

        body {
            display: flex;
            justify-content: center;

            background: linear-gradient(135deg, #667eea, #764ba2);

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;

        .input-container {

            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .input-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        
        .input-container h1 {
            text-align: center;
            margin-bottom: 1.8rem;
            color: #333;
            font-size: 2rem;
            position: relative;
            padding-bottom: 10px;
        }
        
        .input-container h1::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 3px;
            background: linear-gradient(to right, #667eea, #764ba2);
            border-radius: 3px;
        }
        
        .form-group {
            margin-bottom: 1.8rem;
            position: relative;

        .form-group input:focus {

            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0.1), rgba(255,255,255,0));
            transform: translateX(0);
            transition: transform 0.3s;

        .btn:hover::after {
            transform: translateX(100%);
        }
        
        .btn-secondary {
            background: linear-gradient(to right, #6c757d, #495057);

        }
        
        .btn-secondary:hover {
            background: linear-gradient(to right, #495057, #6c757d);
        }
        
        .btn-danger {
            background: linear-gradient(to right, #e74c3c, #c0392b);

        .btn-danger:hover {
            background: linear-gradient(to right, #c0392b, #e74c3c);

            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;

        .route-option {
            padding: 1rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background-color: #f8f9fa;
        }
        
        .route-option:hover {
            border-color: #667eea;
            background-color: #f0f4ff;
            transform: translateY(-2px);
        }
        
        .route-option.selected {
            border-color: #667eea;
            background-color: #e8eaf6;
            color: #3949ab;
            font-weight: 600;
        }
        
        .route-option .route-type {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 0.5rem;
        }
        
        .route-option .route-code {
            font-size: 1.2rem;
            font-weight: 600;
        }
        
        .time-selector {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }
        
        .time-option {
            flex: 1;
            padding: 1rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background-color: #f8f9fa;
        }
        
        .time-option:hover {
            border-color: #667eea;
            background-color: #f0f4ff;
            transform: translateY(-2px);
        }
        
        .time-option.selected {
            border-color: #667eea;
            background-color: #e8eaf6;
            color: #3949ab;
            font-weight: 600;
        }
        
        .time-option .time-label {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 0.5rem;
        }
        
        .time-option .time-value {
            font-size: 1.2rem;
            font-weight: 600;
        }
        
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }
        
        .loading.active {
            opacity: 1;
            visibility: visible;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 600px) {
            .input-container {
                padding: 2rem;
                margin: 1rem;
            }
            
            .route-selector {
                grid-template-columns: 1fr;
            }
            
            .time-selector {
                flex-direction: column;

    </style>
</head>
<body>
    <div class="input-container">
        <button class="btn btn-danger" id="logoutBtn">Logout</button>
        <h1>Route Input</h1>
        
        <form id="routeForm">
            <div class="form-group">
                <label for="time">Time</label>
                <div class="time-selector">
                    <div class="time-option" data-time="morning">
                        <div class="time-label">Morning</div>
                        <div class="time-value">06:00 - 10:00</div>
                    </div>
                    <div class="time-option" data-time="midday">
                        <div class="time-label">Midday</div>
                        <div class="time-value">10:00 - 16:00</div>
                    </div>
                    <div class="time-option" data-time="evening">
                        <div class="time-label">Evening</div>
                        <div class="time-value">16:00 - 20:00</div>
                    </div>
                    <div class="time-option" data-time="off-peak">
                        <div class="time-label">Off-Peak</div>
                        <div class="time-value">20:00 - 06:00</div>
                    </div>
                </div>
                <input type="time" id="time" required>
                <button type="button" class="btn btn-secondary" id="currentTimeBtn">Use Current Time</button>
            </div>
            
            <div class="form-group">
                <label for="routeCode">Route Code</label>
                <div class="route-selector">
                    <div class="route-option" data-code="335.0E">
                        <div class="route-type">Regular Route</div>
                        <div class="route-code">335E</div>
                    </div>
                    <div class="route-option" data-code="201">
                        <div class="route-type">Regular Route</div>
                        <div class="route-code">201</div>
                    </div>
                    <div class="route-option" data-code="356.0C">
                        <div class="route-type">Regular Route</div>
                        <div class="route-code">356C</div>
                    </div>
                    <div class="route-option" data-code="276">
                        <div class="route-type">Regular Route</div>
                        <div class="route-code">276</div>
                    </div>
                </div>
                <input type="text" id="routeCode" placeholder="Enter route code (e.g., 335E, 201, 356C, 276)" required>
            </div>
            
            <button type="submit" class="btn">Submit</button>
        </form>
    </div>
    
    <div class="loading">
        <div class="spinner"></div>
    </div>

    <script>
        window.addEventListener('load', function() {
            if (sessionStorage.getItem('isLoggedIn') !== 'true') {
                window.location.href = 'index.html';
                return;
            }
            
            updateCurrentTime();
            
            document.querySelectorAll('.route-option').forEach(option => {
                option.addEventListener('click', function() {
                    document.querySelectorAll('.route-option').forEach(opt => {
                        opt.classList.remove('selected');
                    });
                    this.classList.add('selected');
                    document.getElementById('routeCode').value = this.dataset.code;
                });
            });
            
            document.querySelectorAll('.time-option').forEach(option => {
                option.addEventListener('click', function() {
                    document.querySelectorAll('.time-option').forEach(opt => {
                        opt.classList.remove('selected');
                    });
                    this.classList.add('selected');
                    const time = this.dataset.time;
                    let hours, minutes;
                    switch(time) {
                        case 'morning':
                            hours = '08';
                            minutes = '00';
                            break;
                        case 'midday':
                            hours = '13';
                            minutes = '00';
                            break;
                        case 'evening':
                            hours = '18';
                            minutes = '00';
                            break;
                        case 'off-peak':
                            hours = '22';
                            minutes = '00';
                            break;
                    }
                    document.getElementById('time').value = `${hours}:${minutes}`;
                });
            });
        });
        
        function updateCurrentTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('time').value = `${hours}:${minutes}`;
            
            const timeInHours = now.getHours();
            let timePeriod;
            if (timeInHours >= 6 && timeInHours < 10) {
                timePeriod = 'morning';
            } else if (timeInHours >= 10 && timeInHours < 16) {
                timePeriod = 'midday';
            } else if (timeInHours >= 16 && timeInHours < 20) {
                timePeriod = 'evening';
            } else {
                timePeriod = 'off-peak';
            }
            
            document.querySelectorAll('.time-option').forEach(opt => {
                if (opt.dataset.time === timePeriod) {
                    opt.classList.add('selected');
                } else {
                    opt.classList.remove('selected');
                }
            });
        }
        
        document.getElementById('currentTimeBtn').addEventListener('click', updateCurrentTime);
        
        document.getElementById('routeForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const time = document.getElementById('time').value;
            const routeCode = document.getElementById('routeCode').value;
            
            if (!['335.0E', '201', '356.0C', '276'].includes(routeCode)) {
                alert('Please enter a valid route code (e.g., 335E, 201, 356C, 276)');
                return;
            }
            
            document.querySelector('.loading').classList.add('active');
            
            sessionStorage.setItem('time', time);
            sessionStorage.setItem('routeCode', routeCode);
            
            setTimeout(() => {
                document.querySelector('.loading').classList.remove('active');
                window.location.href = 'output.html';
            }, 1000);
        });
        
        document.getElementById('logoutBtn').addEventListener('click', function() {
            if (confirm('Are you sure you want to logout?')) {
                sessionStorage.removeItem('isLoggedIn');
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
