<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }

<body>
    <div class="output-container">
        <h1>Route Information</h1>
        
        <div class="info-card">
            <h2>Input Details</h2>
            <div class="info-item">
                <span class="info-label">Time:</span>
                <span class="info-value" id="timeValue">--:--</span>
            </div>
            <div class="info-item">
                <span class="info-label">Route Code:</span>
                <span class="info-value" id="routeCodeValue">--</span>
            </div>
            <div class="info-item">
                <span class="info-label">Source:</span>
                <span class="info-value" id="sourceValue">--</span>
            </div>
            <div class="info-item">
                <span class="info-label">Destination:</span>
                <span class="info-value" id="destinationValue">--</span>
            </div>
        </div>
        
        <div class="result-section">
            <h2>Current Estimate</h2>
            <div class="result-content" id="resultContent">
                <div id="routeTypeIndicator"></div>
                <div id="routeDescription"></div>
                <div id="timePeriodIndicator"></div>
                <div id="travelTimeIndicator" class="travel-time"></div>
            </div>
        </div>
        
        <div class="result-section">
            <h2>Full-Day Forecast</h2>
            <div class="result-content">
                <table class="forecast-table" id="forecastTable">
                    <thead>
                        <tr>
                            <th>Hour</th>
                            <th>Buses Required</th>
                            <th>Travel Time</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
                <div style="margin-top: 1.5rem;">
                    <canvas id="forecastChart" height="140"></canvas>
                </div>
            </div>
        </div>

            <button class="btn btn-secondary" id="backBtn">Back to Input</button>
            <button class="btn btn-danger" id="logoutBtn">Logout</button>
        </div>
    </div>

    <script>
        window.addEventListener('load', async function() {
            if (sessionStorage.getItem('isLoggedIn') !== 'true') {
                window.location.href = 'index.html';
                return;
            }
            
            const time = sessionStorage.getItem('time');
            const routeCode = sessionStorage.getItem('routeCode');
            
            document.getElementById('timeValue').textContent = time || '--:--';
            document.getElementById('routeCodeValue').textContent = routeCode || '--';
            
            await generateResult(time, routeCode);
        });
        
        async function generateResult(time, routeCode) {
            const routeTypeIndicator = document.getElementById('routeTypeIndicator');
            const routeDescription = document.getElementById('routeDescription');
            const timePeriodIndicator = document.getElementById('timePeriodIndicator');
            const travelTimeIndicator = document.getElementById('travelTimeIndicator');
            const sourceValue = document.getElementById('sourceValue');
            const destinationValue = document.getElementById('destinationValue');
            const forecastTableBody = document.getElementById('forecastTable').querySelector('tbody');
            
            // Fetch current estimate
            const estimateResponse = await fetch('/api/estimate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ time, routeCode })
            });
            const estimateData = await estimateResponse.json();
            
            if (estimateData.error) {
                routeDescription.textContent = 'Error fetching estimate';
                return;
            }
            
            // Set route details
            sourceValue.textContent = estimateData.source;
            destinationValue.textContent = estimateData.destination;
            
            // Set route type (all routes in dataset are regular)
            routeTypeIndicator.innerHTML = '<span class="route-type regular">Regular Route</span>';
            
            // Determine time period
            const [hours, minutes] = time.split(':').map(Number);
            const timeInHours = hours + minutes / 60;
            let timePeriod, timePeriodClass, timePeriodText;
            
            if (timeInHours >= 6 && timeInHours < 10) {
                timePeriod = 'morning';
                timePeriodClass = 'morning';
                timePeriodText = 'Morning Peak Hours';
            } else if (timeInHours >= 10 && timeInHours < 16) {
                timePeriod = 'midday';
                timePeriodClass = 'midday';
                timePeriodText = 'Midday';
            } else if (timeInHours >= 16 && timeInHours < 20) {
                timePeriod = 'evening';
                timePeriodClass = 'evening';
                timePeriodText = 'Evening Peak Hours';
            } else {
                timePeriod = 'off-peak';
                timePeriodClass = 'off-peak';
                timePeriodText = 'Off-Peak Hours';
            }
            
            timePeriodIndicator.innerHTML = `<span class="time-period ${timePeriodClass}">${timePeriodText}</span>`;
            
            // Set route description and travel time
            const currentEst = estimateData.current_est === 'N/A' ? 'No data' : `${estimateData.current_est} buses`;
            const nextEst = estimateData.next_est === 'N/A' ? 'No data' : `${estimateData.next_est} buses`;
            routeDescription.textContent = `Current hour: ${currentEst}. Next hour: ${nextEst}.`;
            travelTimeIndicator.textContent = `Estimated Travel Time: ${estimateData.travel_time}`;
            
            // Fetch full-day forecast
            const forecastResponse = await fetch('/api/forecast', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ routeCode })
            });
            const forecastData = await forecastResponse.json();
            
            if (forecastData.error) {
                forecastTableBody.innerHTML = '<tr><td colspan="3">Error fetching forecast</td></tr>';
                return;
            }
            
            // Populate forecast table
            forecastTableBody.innerHTML = '';
            forecastData.forecast.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${item.hour}</td>
                    <td>${item.buses_required === 'N/A' ? 'No data' : item.buses_required}</td>
                    <td>${item.travel_time}</td>
                `;
                forecastTableBody.appendChild(row);
            });

            // Render line chart
            try {
                const labels = forecastData.forecast.map(i => i.hour);
                const data = forecastData.forecast.map(i => (i.buses_required === 'N/A' ? null : i.buses_required));
                const ctx = document.getElementById('forecastChart').getContext('2d');
                if (window._forecastChart) {
                    window._forecastChart.destroy();
                }
                window._forecastChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels,
                        datasets: [{
                            label: 'Buses Required',
                            data,
                            borderColor: '#667eea',
                            backgroundColor: 'rgba(102, 126, 234, 0.2)',
                            tension: 0.25,
                            pointRadius: 2,
                            spanGaps: true,
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            x: { title: { display: true, text: 'Hour' } },
                            y: { beginAtZero: true, title: { display: true, text: 'Buses' }, ticks: { precision: 0 } }
                        },
                        plugins: {
                            legend: { display: true },
                            tooltip: { mode: 'index', intersect: false }
                        }
                    }
                });
            } catch (e) {
                console.error('Chart render error:', e);
            }
            
            // Add animations
            setTimeout(() => {
                routeTypeIndicator.style.opacity = '1';
                routeTypeIndicator.style.transform = 'translateY(0)';
            }, 100);
            setTimeout(() => {
                routeDescription.style.opacity = '1';
                routeDescription.style.transform = 'translateY(0)';
            }, 200);
            setTimeout(() => {
                timePeriodIndicator.style.opacity = '1';
                timePeriodIndicator.style.transform = 'translateY(0)';
            }, 300);
            setTimeout(() => {
                travelTimeIndicator.style.opacity = '1';
                travelTimeIndicator.style.transform = 'translateY(0)';
            }, 400);
        }
        
        document.getElementById('backBtn').addEventListener('click', function() {
            window.location.href = 'input.html';
        });
        
        document.getElementById('logoutBtn').addEventListener('click', function() {
            if (confirm('Are you sure you want to logout?')) {
                sessionStorage.removeItem('isLoggedIn');
                window.location.href = 'index.html';
            }
        });
    </script>
